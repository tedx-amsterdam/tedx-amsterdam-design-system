name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm publishes whatever version package.json says; a tag that does not
      # match it would publish the wrong release.
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      # Node 22 bundles npm 10; trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@11
      - run: npm ci
      # prepublishOnly runs lint, typecheck, tests and build:dist
      - run: npm publish --provenance
