<!-- @dsCard group="Components" viewport="700x900" name="Core components" subtitle="Buttons · tags · links · cards · inputs · stats · accordion" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--tedx-black); font-family: var(--font-sans); color: #fff; }
  #root { padding: 32px; }
  .grp { border-top: 1px solid #1e1e1e; padding: 24px 0; }
  .grp:first-child { border-top: none; padding-top: 6px; }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tedx-gray-400); margin-bottom: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const {
    Button, Tag, ArrowLink, SectionHeader, Stat, MediaCard, Input, SocialLink, Accordion, Logo,
    Select, Textarea, Checkbox, Radio, FormField, Modal, Toast, Badge, Breadcrumb, Tabs, NavigationBar
  } = window.TEDxAmsterdamDesignSystem_a084aa;

  function Demo() {
    const [modalOpen, setModalOpen] = React.useState(false);
    const [toast, setToast] = React.useState(null);
    return (
      <div>
        <div className="grp">
          <div className="lbl">Buttons</div>
          <div className="row">
            <Button variant="primary" arrow>Notify me</Button>
            <Button variant="secondary">Sign up</Button>
            <Button variant="ghost" size="sm">View All Events</Button>
            <Button variant="primary" disabled>Disabled</Button>
          </div>
        </div>

        <div className="grp">
          <div className="lbl">Tags &amp; links</div>
          <div className="row" style={{ gap: 28 }}>
            <Tag>Start-up Accelerator</Tag>
            <Tag color="white" dot>24 Jun 2025</Tag>
            <ArrowLink>Check out our past Speakers</ArrowLink>
          </div>
        </div>

        <div className="grp">
          <div className="lbl">Section header</div>
          <SectionHeader
            eyebrow="Speakers"
            title="Our Speakers"
            description="TEDxAmsterdam invites speakers to inspire with powerful stories. Each year, a new theme sparks inspiration and ideas."
            link="Check out our past Speakers"
          />
        </div>

        <div className="grp">
          <div className="lbl">Stats</div>
          <Stat value="2009" label="events have been organised since" />
        </div>

        <div className="grp">
          <div className="lbl">Media card</div>
          <div style={{ maxWidth: 300 }}>
            <MediaCard
              image="../../assets/photo-audience.jpg"
              category="News"
              title="The power of ideas"
              description="5 talks that changed Amsterdam"
              date="24 Jun 2025"
            />
          </div>
        </div>

        <div className="grp">
          <div className="lbl">Accordion</div>
          <Accordion items={[
            { q: "Who are our pioneers?", a: "Pioneers are individuals with new ways of thinking that move an idea into a prototype of a real-world solution." },
            { q: "Does one have to pay a fee?", a: "No — the program is free for selected pioneers." },
          ]} />
        </div>

        <div className="grp">
          <div className="lbl">Input &amp; social</div>
          <div className="col">
            <div style={{ maxWidth: 320 }}><Input label="Email" /></div>
            <div className="row" style={{ gap: 28 }}>
              <SocialLink network="linkedin" label="LinkedIn" base="../../" />
              <SocialLink network="instagram" label="Instagram" base="../../" />
              <SocialLink network="youtube" label="YouTube" base="../../" />
            </div>
          </div>
        </div>

        <div className="grp">
          <div className="lbl">Select &amp; Textarea</div>
          <div className="col" style={{ maxWidth: 320 }}>
            <Select
              label="Country"
              options={[{ value: "nl", label: "Netherlands" }, { value: "de", label: "Germany" }]}
              value=""
              onChange={() => {}}
            />
            <Textarea label="Message" rows={3} placeholder="Tell us your idea…" />
          </div>
        </div>

        <div className="grp">
          <div className="lbl">Checkbox &amp; Radio</div>
          <div className="col">
            <Checkbox label="I agree to the terms" checked={false} onChange={() => {}} />
            <Checkbox label="Subscribe to newsletter" checked={true} onChange={() => {}} />
            <Radio
              legend="Session type"
              name="session-demo"
              options={[{ value: "morning", label: "Morning" }, { value: "evening", label: "Evening" }]}
              value="morning"
              onChange={() => {}}
            />
          </div>
        </div>

        <div className="grp">
          <div className="lbl">Badge &amp; Breadcrumb</div>
          <div className="col">
            <div className="row">
              <Badge label="New" />
              <Badge label="Live" color="red" />
              <Badge label="Draft" color="muted" />
              <Badge label="Sold out" color="white" size="sm" />
            </div>
            <Breadcrumb items={[{ label: "Home", href: "/" }, { label: "Speakers", href: "/speakers" }, { label: "Ada Lovelace" }]} />
          </div>
        </div>

        <div className="grp">
          <div className="lbl">Tabs</div>
          <Tabs tabs={[
            { label: "Overview", content: <p style={{ color: "var(--text-secondary)", margin: "16px 0 0" }}>Overview content.</p> },
            { label: "Schedule", content: <p style={{ color: "var(--text-secondary)", margin: "16px 0 0" }}>Schedule details.</p> },
          ]} />
        </div>

        <div className="grp">
          <div className="lbl">Modal</div>
          <div className="row">
            <Button variant="primary" onClick={() => setModalOpen(true)}>Open Modal</Button>
          </div>
          <Modal
            isOpen={modalOpen}
            onClose={() => setModalOpen(false)}
            title="Confirm registration"
          >
            <p style={{ color: "var(--text-secondary)" }}>Are you sure you want to register?</p>
            <div style={{ display: "flex", gap: "var(--space-3)", marginTop: "var(--space-6)" }}>
              <Button variant="primary" onClick={() => setModalOpen(false)}>Confirm</Button>
              <Button variant="ghost" onClick={() => setModalOpen(false)}>Cancel</Button>
            </div>
          </Modal>
        </div>

        <div className="grp">
          <div className="lbl">Toast</div>
          <div className="row">
            <Button variant="secondary" onClick={() => setToast({ type: "info", message: "Changes saved." })}>Info toast</Button>
            <Button variant="primary" onClick={() => setToast({ type: "error", message: "Something went wrong." })}>Error toast</Button>
          </div>
          {toast && (
            <Toast message={toast.message} type={toast.type} onDismiss={() => setToast(null)} />
          )}
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
