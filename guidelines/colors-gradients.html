<!-- @dsCard group="Colors" viewport="700x260" name="Heat gradients" subtitle="The signature edge / corner / radial glows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--tedx-black); font-family: var(--font-sans); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 24px; }
  .tile { height: 180px; border-radius: 4px; position: relative; overflow: hidden; border: 1px solid #1d1d1d; }
  .lbl { position: absolute; left: 12px; bottom: 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; z-index: 2; }
  .edge::before { content: ""; position: absolute; inset: 0 auto 0 50%; transform: translateX(-50%); width: 90px; background: var(--glow-edge); }
  .corner { background: var(--glow-corner); }
  .radial { background: var(--glow-radial); }
  .tile-fill { background: var(--grad-tile); }
</style>
</head>
<body>
  <div class="grid">
    <div class="tile edge" style="background:#000"><span class="lbl">Edge glow</span></div>
    <div class="tile corner"><span class="lbl">Corner</span></div>
    <div class="tile radial"><span class="lbl">Radial</span></div>
    <div class="tile tile-fill"><span class="lbl">Tile fill</span></div>
  </div>
</body>
</html>
