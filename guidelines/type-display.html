<!-- @dsCard group="Type" viewport="700x340" name="Display & headings" subtitle="Helvetica Bold · tight leading · −3% tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--tedx-black); font-family: var(--font-sans); color: #fff; padding: 28px 32px; }
  .spec { display: flex; flex-direction: column; gap: 22px; }
  .line { display: flex; align-items: baseline; gap: 18px; }
  .meta { color: var(--tedx-gray-400); font-size: 12px; min-width: 132px; flex: none; letter-spacing: 0.02em; }
  h1,h2,h3 { margin: 0; letter-spacing: var(--ls-display); font-weight: 700; line-height: 1; }
  .d { font-size: 64px; }
  .h1 { font-size: 56px; }
  .h2 { font-size: 40px; }
  .h3 { font-size: 28px; }
  .red { color: var(--tedx-red); }
</style>
</head>
<body>
  <div class="spec">
    <div class="line"><span class="meta">Display / 80–121px</span><h1 class="d">AMSTERDAM <span class="red">REIMAGINED</span></h1></div>
    <div class="line"><span class="meta">H1 / 80 / 700 / -3%</span><h1 class="h1">Unsung heroes</h1></div>
    <div class="line"><span class="meta">H2 / 56 / 700 / -3%</span><h2 class="h2">Our Speakers</h2></div>
    <div class="line"><span class="meta">H3 / 32 / 700 / -3%</span><h3 class="h3">Be the first to get tickets</h3></div>
  </div>
</body>
</html>
