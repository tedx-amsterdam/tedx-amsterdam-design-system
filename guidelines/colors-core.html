<!-- @dsCard group="Colors" viewport="700x200" name="Core palette" subtitle="TED Red over black, white ink, orange accent" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--tedx-black); font-family: var(--font-sans); }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 24px; }
  .sw { aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; box-sizing: border-box; }
  .sw .name { font-weight: 700; font-size: 15px; }
  .sw .hex { font-size: 13px; opacity: 0.75; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .red { background: var(--tedx-red); color: #fff; }
  .white { background: var(--tedx-white); color: #000; border: 1px solid #2a2a2a; }
  .black { background: var(--tedx-black); color: #fff; border: 1px solid #2a2a2a; }
  .orange { background: var(--tedx-orange); color: #000; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw red"><span class="name">Red</span><span class="hex">#EB0028</span></div>
    <div class="sw white"><span class="name">White</span><span class="hex">#FFFFFF</span></div>
    <div class="sw black"><span class="name">Black</span><span class="hex">#000000</span></div>
    <div class="sw orange"><span class="name">Orange</span><span class="hex">#F36C21</span></div>
  </div>
</body>
</html>
