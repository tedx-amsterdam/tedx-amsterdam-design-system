<!-- @dsCard group="Website" viewport="1400x880" name="TEDxAmsterdam website" subtitle="Amsterdam Reimagined — hero, speakers, blog (click-through)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<base href="/ui_kits/website/" />
<title>TEDxAmsterdam — Amsterdam Reimagined</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--tedx-black); }
  body { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  body::-webkit-scrollbar { width: 10px; }
  body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 6px; }
  a { -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--tedx-red); color: #fff; }

  /* ---------- Responsive / mobile ---------- */
  .nav-burger { display: none; }
  @media (max-width: 860px) {
    :root { --gutter-wide: 22px; --gutter: 22px; --section-gap: 64px; }
    /* nav → hamburger */
    .nav-desktop { display: none !important; }
    .nav-burger { display: flex !important; }
    /* collapse every multi-column grid to a single stacked column */
    [style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
      grid-auto-rows: auto !important;
      gap: 28px !important;
    }
    /* masonry tiles need a visible height once stacked */
    [style*="grid-row"] { grid-row: auto !important; grid-column: auto !important; min-height: 220px; }
    /* tighten oversized section padding */
    section { padding-left: var(--gutter) !important; padding-right: var(--gutter) !important; }
  }
  @media (max-width: 520px) {
    :root { --gutter-wide: 18px; --gutter: 18px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="bundle.js"></script>
</body>
</html>
